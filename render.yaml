services:
  - type: web
    name: muse
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /api/version
    autoDeploy: true
    # Frontend deploys go to Cloudflare; restarting here wipes the audio cache.
    buildFilter:
      paths:
        - server.py
        - warp_profile.py
        - Dockerfile
        - docker-start.sh
        - requirements.txt
