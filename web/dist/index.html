  <script>
  (function () {
    var p = location.pathname || '/';
    var lane = null;
    if (/^\/pc(\/|$)/.test(p)) lane = 'pc';
    else if (/^\/web(\/|$)/.test(p)) lane = 'web';
    else if (/^\/mobile\/iphone(\/|$)/.test(p)) lane = 'iphone';
    else if (/^\/mobile\/android(\/|$)/.test(p)) lane = 'android';
    try {
      if (window.chrome && window.chrome.webview) {
        document.documentElement.classList.add('muse-app');
        window.__museDesktop = 1;
        if (!lane) lane = 'pc';

      if (/MuseAndroid/i.test(navigator.userAgent || '')) {
        document.documentElement.classList.add('muse-android');
        window.__museAndroid = 1;
        if (!lane) lane = 'android';
      }

      document.documentElement.classList.toggle('dark', dark);
    } catch (e) {}
  })();
  </script>
