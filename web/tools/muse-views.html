
      <!-- Muse: friends, chat and account views, built from Riff's view / list / hero components -->
      <section class="content-view" id="view-friends">
        <div class="view-header">
          <div>
            <h2>Chats</h2>
            <span class="view-subtitle" id="friends-subtitle">Friends, requests and messages</span>
          </div>
        </div>
        <div class="view-search-box" id="friends-search-box">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"></circle><line x1="21" y1="21" x2="16.5" y2="16.5"></line></svg>
          <input type="text" class="view-search-input" id="friends-search-input" placeholder="Find people by @handle..." autocomplete="off" autocapitalize="off" spellcheck="false">
        </div>
        <div id="friends-body"></div>
      </section>

      <section class="content-view" id="view-chat">
        <div class="muse-chat">
          <div class="muse-chat-head">
            <button class="btn-icon-pill" id="btn-chat-back" title="Back" aria-label="Back">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="19" y1="12" x2="5" y2="12"></line><polyline points="12 19 5 12 12 5"></polyline></svg>
            </button>
            <button class="muse-chat-peer" id="btn-chat-peer" type="button">
              <span class="muse-avatar-slot" id="chat-peer-avatar"></span>
              <span class="muse-chat-peer-meta">
                <span class="track-row-title" id="chat-peer-name"></span>
                <span class="track-row-artist" id="chat-peer-status"></span>
              </span>
            </button>
            <button class="btn-icon-pill delete-btn" id="btn-chat-remove" title="Remove friend" aria-label="Remove friend">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><line x1="17" y1="11" x2="23" y2="11"></line></svg>
            </button>
          </div>
          <div class="muse-chat-log" id="chat-log"></div>
          <div class="muse-chat-reply hidden" id="chat-reply">
            <span id="chat-reply-text"></span>
            <button class="btn-icon-pill" id="btn-chat-reply-cancel" title="Cancel" aria-label="Cancel">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>
            </button>
          </div>
          <div class="muse-chat-rec hidden" id="chat-rec">
            <video id="chat-rec-preview" class="muse-round-preview hidden" muted autoplay playsinline webkit-playsinline></video>
            <span class="muse-rec-dot"></span><span id="chat-rec-time">0:00</span>
            <span class="muse-chat-rec-label" id="chat-rec-label">Recording voice</span>
            <button class="btn-icon-pill delete-btn" id="btn-rec-cancel" title="Discard" aria-label="Discard">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path></svg>
            </button>
            <button class="btn-pill-primary" id="btn-rec-send">Send</button>
          </div>
          <div class="muse-chat-compose" id="chat-compose">
            <div class="m3-dropdown muse-attach" id="chat-attach">
              <button class="btn-icon-pill" id="btn-chat-attach" title="Attach" aria-label="Attach" type="button">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path></svg>
              </button>
              <div class="m3-dropdown-menu" id="chat-attach-menu">
                <button class="m3-dropdown-option" type="button" data-attach="file">Photo, video or audio</button>
                <button class="m3-dropdown-option" type="button" data-attach="song">Track</button>
                <button class="m3-dropdown-option" type="button" data-attach="now">Now playing</button>
                <button class="m3-dropdown-option" type="button" data-attach="gif">GIF</button>
                <button class="m3-dropdown-option" type="button" data-attach="round">Round video</button>
              </div>
            </div>
            <input type="file" id="chat-file" hidden accept="image/*,video/*,audio/*,.heic,.heif,.mov,.m4v,.mp4,.m4a,.aac,.caf,.mp3,.wav">
            <textarea id="chat-input" class="pill-text-input muse-chat-input" rows="1" placeholder="Message" maxlength="2000"></textarea>
            <button class="btn-icon-pill" id="btn-chat-mic" title="Voice message" aria-label="Voice message">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"></path><path d="M19 10v2a7 7 0 0 1-14 0v-2"></path><line x1="12" y1="19" x2="12" y2="22"></line></svg>
            </button>
            <button class="btn-play-pause muse-send hidden" id="btn-chat-send" title="Send" aria-label="Send">
              <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
          </div>
        </div>
      </section>

      <section class="content-view" id="view-account">
        <div id="account-body"></div>
      </section>

      <section class="content-view" id="view-user">
        <div id="user-body"></div>
      </section>
